name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    name: hermes-agent @ ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # release commits: v0.20.0 (2026.8.3), v0.20.1 (2026.8.13),
        # v0.20.2 (2026.8.16), v0.20.3 (2026.8.16.2, 7339f5f), v0.20.4
        # (2026.8.18, 9f13bbbf), v0.20.5 (2026.8.19, fcbd107) — the patch is
        # apply-checked against all six plus current main; a future release
        # that drifts is caught
        # by install.sh's fail-loud apply-check (not by this matrix).
        ref: [3c27eb623, 720f0443a, df4b65147, 7339f5f, 9f13bbbf, fcbd107]
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags: the battery's downgrade assertion
          # (value_id D5) extracts `git show v0.4.1:bin/info-guard`
          # (IG D64–D69, MIN-3)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks (pinned 8.30.1)
        run: |
          curl -sSfL -o /tmp/gl.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Clone hermes-agent @ ${{ matrix.ref }}
        run: |
          # Retry loop: GitHub rate-limits concurrent blobless clones of
          # this repo (HTTP 429) under 5-way matrix concurrency (seen
          # 2026-08-19 v0.3.0 — two consecutive runs failed legs on 429).
          for i in 1 2 3; do
            git clone --quiet --filter=blob:none https://github.com/NousResearch/hermes-agent.git /tmp/hermes && break
            echo "clone attempt $i failed (rate limit?), retrying…"
            sleep 15
            rm -rf /tmp/hermes
          done
          test -d /tmp/hermes/.git || { echo "clone failed after 3 attempts" >&2; exit 1; }
          git -C /tmp/hermes checkout --quiet ${{ matrix.ref }}

      - name: Apply patch (apply-check first — fail loud on drift)
        run: |
          git -C /tmp/hermes apply --check "$GITHUB_WORKSPACE/patch/redactor-registry-patterns.patch"
          git -C /tmp/hermes apply "$GITHUB_WORKSPACE/patch/redactor-registry-patterns.patch"

      - name: Copy test suite
        run: |
          mkdir -p /tmp/hermes/tests/hermes_cli
          cp "$GITHUB_WORKSPACE/tests/agent/test_redact_registry_patterns.py" /tmp/hermes/tests/agent/
          cp "$GITHUB_WORKSPACE/tests/hermes_cli/test_redact_patterns_bridge.py" /tmp/hermes/tests/hermes_cli/

      - name: Install test dependencies
        run: pip install --quiet pytest pyyaml python-dotenv

      - name: Upstream suite (15 tests)
        run: cd /tmp/hermes && python -m pytest tests/agent/test_redact_registry_patterns.py tests/hermes_cli/test_redact_patterns_bridge.py -q

      - name: Assert upstream suite count stays 15 (audit1-followup)
        run: |
          cd /tmp/hermes
          COUNT=$(python -m pytest tests/agent/test_redact_registry_patterns.py tests/hermes_cli/test_redact_patterns_bridge.py --collect-only -q 2>&1 | tail -1)
          echo "$COUNT"
          echo "$COUNT" | grep -q '15 tests collected'

      - name: Package battery (35 checks)
        run: bash "$GITHUB_WORKSPACE/test.sh" --checkout /tmp/hermes

      - name: Repo secret scan
        run: gitleaks dir "$GITHUB_WORKSPACE" --redact=8 --no-banner --exit-code=1
